name: Issue Automation

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Add labels and welcome comment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ensure tutorial labels exist
        run: |
          gh label create bug --color d73a4a --description "Something is not working" --force
          gh label create "help wanted" --color 008672 --description "Extra attention is needed" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Add bug label when issue mentions a bug
        if: contains(github.event.issue.title, 'bug') || contains(github.event.issue.body, 'bug')
        run: gh issue edit "$ISSUE_NUMBER" --add-label bug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Add help wanted label when issue asks for help
        if: contains(github.event.issue.title, 'help') || contains(github.event.issue.body, 'help')
        run: gh issue edit "$ISSUE_NUMBER" --add-label "help wanted"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Comment on new issues
        if: github.event.action == 'opened'
        run: gh issue comment "$ISSUE_NUMBER" --body "Thanks for opening this issue. A maintainer will review it soon."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Suggest an exact-title duplicate
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          matches=$(gh issue list --state open --limit 100 --json number,title,url --search "\"$ISSUE_TITLE\" in:title")
          duplicate=$(jq -r --argjson current "$ISSUE_NUMBER" --arg title "$ISSUE_TITLE" \
            '[.[] | select(.number != $current and (.title | ascii_downcase) == ($title | ascii_downcase))][0].url // empty' \
            <<< "$matches")
          if [[ -n "$duplicate" ]]; then
            gh issue comment "$ISSUE_NUMBER" --body "This issue has the same title as an existing open issue: $duplicate. Please check whether it is related; this is only an automated suggestion."
          fi

      - name: Assign configured issue triager
        if: github.event.action == 'opened' && vars.ISSUE_TRIAGE_ASSIGNEE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TRIAGE_ASSIGNEE: ${{ vars.ISSUE_TRIAGE_ASSIGNEE }}
        run: gh issue edit "$ISSUE_NUMBER" --add-assignee "$ISSUE_TRIAGE_ASSIGNEE"
