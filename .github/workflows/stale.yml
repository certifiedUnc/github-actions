name: Stale Issues and Pull Requests

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale-items
  cancel-in-progress: true

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark and close stale issues and pull requests
        uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: "This issue has had no activity for 30 days. It will be closed in 7 days if there is no further activity."
          stale-pr-message: "This pull request has had no activity for 30 days. It will be closed in 7 days if there is no further activity."
          close-issue-message: "Closing this issue because it has remained inactive. Reopen it or comment if it is still relevant."
          close-pr-message: "Closing this pull request because it has remained inactive. Reopen it or comment if it is still relevant."
          exempt-issue-labels: "bug,help wanted,pinned"
          exempt-pr-labels: "pinned"
          exempt-all-issue-milestones: true
          exempt-all-pr-milestones: true
          operations-per-run: 100
